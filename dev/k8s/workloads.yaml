# Workloads to look at: healthy ones, and the usual ways a pod fails.
#
#   shop/web        Running (3 pods)
#   shop/api        CrashLoopBackOff (the container exits)
#   shop/cache      ImagePullBackOff (the image does not exist)
#   shop/db         StatefulSet, Running
#   payments/checkout  Running (2 pods)
#   payments/worker    Pending (asks for more CPU than any node has)
#   payments/ledger    CreateContainerConfigError (a missing ConfigMap key)
#   ops/node-agent     DaemonSet, Running
#   demo/*             Widgets: a custom resource, with a phase in their status
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels: { app: web, tier: frontend }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web, tier: frontend }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels: { app: api, tier: backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api, tier: backend }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', "echo 'connecting to database'; sleep 2; echo 'database unreachable' >&2; exit 1"]
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: shop
  labels: { app: cache, tier: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: cache } }
  template:
    metadata:
      labels: { app: cache, tier: backend }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: cache
          image: registry.invalid/example/cache:1.0
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: shop
  labels: { app: db, tier: data }
spec:
  replicas: 1
  serviceName: db
  selector: { matchLabels: { app: db } }
  template:
    metadata:
      labels: { app: db, tier: data }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: db
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
  labels: { app: checkout, tier: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: checkout } }
  template:
    metadata:
      labels: { app: checkout, tier: frontend }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: checkout
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: payments
  labels: { app: worker, tier: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker, tier: backend }
    spec:
      containers:
        - name: worker
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          resources: { requests: { cpu: '64', memory: 8Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
  labels: { app: ledger, tier: data }
spec:
  replicas: 1
  selector: { matchLabels: { app: ledger } }
  template:
    metadata:
      labels: { app: ledger, tier: data }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: ledger
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          env:
            - name: LEDGER_URL
              valueFrom: { configMapKeyRef: { name: ledger-config, key: url } }
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: ops
  labels: { app: node-agent }
spec:
  selector: { matchLabels: { app: node-agent } }
  template:
    metadata:
      labels: { app: node-agent }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: agent
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'while true; do sleep 3600; done']
          resources: { requests: { cpu: 5m, memory: 8Mi } }
---
# A custom resource with no controller: its status is written here, which a CRD without the status
# subresource allows. The datasource reads it through a custom-resource allow-list entry and RBAC rule.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names: { plural: widgets, singular: widget, kind: Widget }
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
