# The Perses pod's own service account token and the cluster CA. Perses reads both files on every request,
# so the projected token can rotate. security.secret_file_allowed_directories in the Perses config must list
# their directory.
kind: GlobalSecret
metadata:
  name: kubernetes-in-cluster
spec:
  authorization:
    type: Bearer
    credentialsFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
