# The default allow-list (GET on the list endpoints of the builtin resources), plus one custom resource.
kind: GlobalDatasource
metadata:
  name: kubernetes
spec:
  default: true
  plugin:
    kind: KubernetesDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: https://kubernetes.default.svc
          secret: kubernetes-in-cluster
          allowedEndpoints:
            - endpointPattern: ^/api/v1/(namespaces|nodes)$
              method: GET
            - endpointPattern: ^/api/v1/(namespaces/[a-z0-9]([-a-z0-9]*[a-z0-9])?/)?(pods|events)$
              method: GET
            - endpointPattern: ^/apis/apps/v1/(namespaces/[a-z0-9]([-a-z0-9]*[a-z0-9])?/)?(deployments|statefulsets|daemonsets|replicasets)$
              method: GET
            - endpointPattern: ^/apis/example\.com/v1/(namespaces/[a-z0-9]([-a-z0-9]*[a-z0-9])?/)?widgets$
              method: GET
